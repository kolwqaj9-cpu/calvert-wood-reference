site_name: "Engineered Wood & Panel Products Reference"
site_url: https://calvert-wood-reference.readthedocs.io/
site_description: "Engineered Wood & Panel Products Reference: compiled from public-domain US federal government publications."
site_author: "Calvert Manufacturing Archive"
copyright: "Compiled from public-domain US federal government publications."

docs_dir: docs

theme:
  name: material
  features:
    - navigation.top
  palette:
